<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vizit Defteri · v27</title>

  <!-- PWA & iOS Safari (Dynamic Island Uyumlu) -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vizit Defteri">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230f172a'/%3E%3Cpath d='M96 272h88l40-112 56 192 48-128 32 48h56' fill='none' stroke='%2338bdf8' stroke-width='36' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="./styles.css">

  <!-- GitHub Pages & Çevrimdışı Ortam Algılayıcı -->
  <script>
    (function () {
      const isStaticHost =
        location.hostname.endsWith('github.io') ||
        location.protocol === 'file:' ||
        localStorage.getItem('vizit_force_local') === '1';

      window.__VIZIT_STATIC_PWA__ = isStaticHost;

      if (isStaticHost) {
        const nativeFetch = window.fetch.bind(window);
        window.fetch = async function (input, init) {
          const url = typeof input === 'string' ? input : (input && input.url) || '';
          if (url.includes('/api/')) {
            const now = Date.now();
            const body = {
              ok: true,
              status: 'ok',
              localOnly: true,
              mode: 'github-pages-pwa',
              records: [],
              items: [],
              photos: [],
              updatedAt: now,
              timestamp: now
            };
            return new Response(JSON.stringify(body), {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            });
          }
          return nativeFetch(input, init);
        };
      }

      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
        });
      }
    })();
  </script>
</head>
<body>
  <!-- Uygulama Kapsayıcısı -->
  <div id="app">
    <header class="app-header">
      <div class="brand">Vizit Defteri · v27</div>
      <div id="sync-badge" class="sync-badge local">Yerel PWA</div>
    </header>
    <main class="app-content">
      <div class="loading-state">YBÜ hasta izlem modülleri yükleniyor...</div>
    </main>
  </div>

  <!-- Ana Giriş Modülü -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
