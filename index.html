<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YBÜ Vizit Takip</title>
  
  <!-- Mobil PWA Ayarları -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YBÜ Vizit">
  <meta name="theme-color" content="#0F172A">
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS & Lucide Icons CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased select-none pb-12">

  <!-- Üst Bar -->
  <header class="bg-slate-900 text-white p-3 shadow-md sticky top-0 z-20 flex justify-between items-center">
    <div>
      <h1 class="text-base font-bold tracking-tight">Yoğun Bakım Vizit Çizelgesi</h1>
      <p id="currentDateText" class="text-xs text-teal-400 font-medium"></p>
    </div>
    <button onclick="openSummaryModal()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-teal-300 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-semibold active:scale-95 transition">
      <i data-lucide="clipboard-list" class="w-4 h-4"></i>
      Vizit Özeti
    </button>
  </header>

  <!-- 16 Yatak Izgarası -->
  <main class="p-3">
    <div id="bedsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-2.5"></div>
  </main>

  <!-- Vizit Düzenleme Modalı -->
  <div id="editModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3 backdrop-blur-sm">
    <div class="bg-white w-full max-w-lg rounded-xl shadow-2xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
        <h2 id="modalBedTitle" class="font-bold text-base"></h2>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div class="p-4 overflow-y-auto space-y-3.5 text-xs">
        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-2">
            <label class="block font-semibold mb-1 text-slate-700">Hasta / Yaş</label>
            <input type="text" id="m_name" class="w-full border rounded-lg p-2 focus:ring-1 focus:ring-slate-900 outline-none">
          </div>
          <div>
            <label class="block font-semibold mb-1 text-slate-700">Yatış Günü (G:)</label>
            <input type="number" id="m_day" class="w-full border rounded-lg p-2 focus:ring-1 focus:ring-slate-900 outline-none">
          </div>
        </div>

        <div>
          <label class="block font-semibold mb-1 text-slate-700">Yatış Tanısı</label>
          <input type="text" id="m_diag" class="w-full border rounded-lg p-2 focus:ring-1 focus:ring-slate-900 outline-none">
        </div>
