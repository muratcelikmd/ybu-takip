<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>YBÜ Çoklu Hasta Takip Sistemi</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Tailwind CSS & FontAwesome CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, select {
      user-select: auto;
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 18px);
    }
    .custom-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- ======================================================== -->
  <!-- 1. EKRAN: HASTA LİSTESİ (ANA EKRAN)                      -->
  <!-- ======================================================== -->
  <div id="view-patient-list" class="flex-1 flex flex-col min-h-screen">
    
    <!-- Liste Üst Bar -->
    <header class="sticky top-0 z-30 bg-slate-800/95 backdrop-blur border-b border-slate-700 px-4 py-3 shadow">
      <div class="flex items-center justify-between max-w-lg mx-auto w-full">
        <div class="flex items-center gap-2">
          <div class="bg-cyan-600 text-white p-2 rounded-lg">
            <i class="fa-solid fa-hospital-user text-base"></i>
          </div>
          <div>
            <h1 class="text-sm font-bold text-white tracking-wide">Yoğun Bakım Ünitesi</h1>
            <p class="text-[11px] text-slate-400" id="stat-patient-count">0 Aktif Hasta</p>
          </div>
        </div>

        <button onclick="openPatientModal(null)" class="bg-cyan-600 active:bg-cyan-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow flex items-center gap-1.5 transition">
          <i class="fa-solid fa-user-plus"></i> Yeni Hasta Ekle
        </button>
      </div>
    </header>

    <!-- Hasta Kartları Listesi -->
    <main class="flex-1 max-w-lg mx-auto w-full px-3.5 py-3 space-y-2.5 overflow-y-auto">
      <div id="patients-cards-container" class="space-y-2.5">
        <!-- JS ile hasta kartları buraya basılır -->
      </div>
    </main>
  </div>

  <!-- ======================================================== -->
  <!-- 2. EKRAN: SEÇİLİ HASTA DETAY & TAKİP EKRANI             -->
  <!-- ======================================================== -->
  <div id="view-patient-detail" class="flex-1 flex flex-col min-h-screen hidden">
    
    <!-- Detay Üst Bar -->
    <header class="sticky top-0 z-30 bg-slate-800/95 backdrop-blur border-b border-slate-700 px-4 pt-3 pb-2.5 shadow">
      <div class="max-w-lg mx-auto w-full">
        <div class="flex items-center justify-between">
          <button onclick="backToPatientList()" class="text-slate-300 hover:text-white text-xs flex items-center gap-1 bg-slate-700 active:bg-slate-600 px-2.5 py-1.5 rounded-lg">
            <i class="fa-solid fa-chevron-left"></i> Hastalar
          </button>

          <div class="flex items-center gap-1.5">
            <button onclick="copyHandoffSummary()" title="Devir Özeti Kopyala" class="bg-emerald-600 active:bg-emerald-700 text-white text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1 font-medium shadow">
              <i class="fa-solid fa-share-nodes"></i> Devir
            </button>
            <button onclick="openPatientModal(currentPatientId)" title="Hasta Bilgisini Düzenle" class="bg-slate-700 active:bg-slate-600 text-cyan-300 text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1">
              <i class="fa-solid fa-user-pen"></i> Düzenle
            </button>
            <button onclick="deleteCurrentPatient()" title="Hastayı Sil/Taburcu Et" class="bg-rose-900/60 active:bg-rose-800 text-rose-300 text-xs p-1.5 rounded-lg">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </div>
        </div>

        <!-- Hasta Özet Bilgi -->
        <div class="mt-2.5 pt-2 border-t border-slate-700/60 flex items-center justify-between">
          <div>
            <div class="flex items-center gap-2">
              <h2 class="text-base font-bold text-white tracking-wide" id="disp-patient-name">Hasta Adı</h2>
              <span class="text-[10px] bg-cyan-900/80 text-cyan-300 font-mono px-2 py-0.5 rounded border border-cyan-700" id="disp-patient-bed">Yatak --</span>
            </div>
            <p class="text-[11px] text-slate-400 mt-0.5" id="disp-patient-diag">Tanı / Durum</p>
          </div>
          <div class="text-right">
            <span class="text-[10px] bg-amber-950/80 text-amber-300 px-2 py-0.5 rounded border border-amber-800 font-medium" id="disp-patient-day">1. Gün</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Sekme İçerikleri -->
    <main class="flex-1 overflow-y-auto px-3.5 py-3 pb-24 space-y-4 max-w-lg mx-auto w-full">

      <!-- 1. Sekme: Notlar -->
      <section id="tab-notes" class="space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-clipboard-list text-cyan-400"></i> Klinik Notlar & Vizit
          </h3>
          <button onclick="openModal('modal-note')" class="text-xs bg-cyan-600 active:bg-cyan-700 text-white font-medium px-2.5 py-1 rounded-md flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> Not Ekle
          </button>
        </div>
        <div id="notes-list" class="space-y-2.5"></div>
      </section>

      <!-- 2. Sekme: İlaçlar -->
      <section id="tab-meds" class="space-y-3 hidden">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-pills text-purple-400"></i> İlaçlar & İnfüzyonlar
          </h3>
          <button onclick="openModal('modal-med')" class="text-xs bg-purple-600 active:bg-purple-700 text-white font-medium px-2.5 py-1 rounded-md flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> İlaç Ekle
          </button>
        </div>
        <div id="meds-list" class="space-y-2"></div>
      </section>

      <!-- 3. Sekme: Tetkikler -->
      <section id="tab-labs" class="space-y-3 hidden">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-vial-virus text-rose-400"></i> Tetkik & Kan Gazı
          </h3>
          <button onclick="openModal('modal-lab')" class="text-xs bg-rose-600 active:bg-rose-700 text-white font-medium px-2.5 py-1 rounded-md flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> Sonuç Ekle
          </button>
        </div>
        <div id="labs-list" class="space-y-2.5"></div>
      </section>

      <!-- 4. Sekme: Vitaller -->
      <section id="tab-vitals" class="space-y-3 hidden">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-heart-pulse text-emerald-400"></i> Vital & Sıvı Takibi
          </h3>
          <button onclick="openModal('modal-vital')" class="text-xs bg-emerald-600 active:bg-emerald-700 text-white font-medium px-2.5 py-1 rounded-md flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> Vital Kaydet
          </button>
        </div>
        <div id="latest-vital-card" class="bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs space-y-2"></div>
        <h4 class="text-xs font-semibold text-slate-400 pt-2">Ölçüm Geçmişi</h4>
        <div id="vitals-list" class="space-y-2 text-xs"></div>
      </section>

    </main>

    <!-- Mobil Alt Gezinme Çubuğu -->
    <nav class="fixed bottom-0 inset-x-0 bg-slate-800/95 backdrop-blur border-t border-slate-700 z-40 safe-bottom">
      <div class="grid grid-cols-4 max-w-lg mx-auto text-[10px] text-slate-400 font-medium">
        <button onclick="switchTab('notes')" id="btn-tab-notes" class="py-2.5 flex flex-col items-center gap-1 text-cyan-400">
          <i class="fa-solid fa-clipboard-list text-base"></i>
          <span>Notlar</span>
        </button>
        <button onclick="switchTab('meds')" id="btn-tab-meds" class="py-2.5 flex flex-col items-center gap-1 hover:text-slate-200">
          <i class="fa-solid fa-pills text-base"></i>
          <span>İlaçlar</span>
        </button>
        <button onclick="switchTab('labs')" id="btn-tab-labs" class="py-2.5 flex flex-col items-center gap-1 hover:text-slate-200">
          <i class="fa-solid fa-vial-virus text-base"></i>
          <span>Tetkikler</span>
        </button>
        <button onclick="switchTab('vitals')" id="btn-tab-vitals" class="py-2.5 flex flex-col items-center gap-1 hover:text-slate-200">
          <i class="fa-solid fa-heart-pulse text-base"></i>
          <span>Vitaller</span>
        </button>
      </div>
    </nav>

  </div>

  <!-- ======================================================== -->
  <!-- MODALLER                                                 -->
  <!-- ======================================================== -->

  <!-- HASTA EKLE / DÜZENLE MODALI -->
  <div id="modal-patient" class="fixed inset-0 bg-black/70 z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div class="bg-slate-800 border-t sm:border border-slate-700 rounded-t-2xl sm:rounded-xl max-w-md w-full p-4 space-y-3 text-xs max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <span class="font-bold text-white text-sm" id="modal-patient-title">Yeni Hasta Ekle</span>
        <button onclick="closeModal('modal-patient')" class="text-slate-400 text-lg">&times;</button>
      </div>

      <div>
        <label class="text-slate-400 block mb-1">Hasta Adı Soyadı *</label>
        <input type="text" id="inp-p-name" placeholder="Örn: Ahmet Yılmaz" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-slate-400 block mb-1">Yatak No *</label>
          <input type="text" id="inp-p-bed" placeholder="Örn: Yatak 04" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">YBÜ Günü</label>
          <input type="text" id="inp-p-day" placeholder="Örn: 3. Gün" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-slate-400 block mb-1">Protokol / Dosya No</label>
          <input type="text" id="inp-p-proto" placeholder="2026-94812" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Yaş / Cinsiyet</label>
          <input type="text" id="inp-p-age" placeholder="64 / Erkek" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
      </div>

      <div>
        <label class="text-slate-400 block mb-1">Klinik Tanı & Kabul Nedeni *</label>
        <input type="text" id="inp-p-diag" placeholder="Septik Şok, ARDS, Post-Op vb." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
      </div>

      <div>
        <label class="text-slate-400 block mb-1">Alerji / Özel Durum</label>
        <input type="text" id="inp-p-allergy" placeholder="Penisilin alerjisi, İzolasyon vb." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
      </div>

      <button onclick="savePatient()" class="w-full py-2.5 bg-cyan-600 active:bg-cyan-700 rounded-lg text-white font-bold text-sm shadow">Hastayı Kaydet</button>
    </div>
  </div>

  <!-- NOT EKLEME MODALI -->
  <div id="modal-note" class="fixed inset-0 bg-black/70 z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div class="bg-slate-800 border-t sm:border border-slate-700 rounded-t-2xl sm:rounded-xl max-w-md w-full p-4 space-y-3 text-xs">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <span class="font-bold text-white text-sm">Klinik Not Ekle</span>
        <button onclick="closeModal('modal-note')" class="text-slate-400 text-lg">&times;</button>
      </div>
      <div>
        <label class="text-slate-400 block mb-1">Kategori</label>
        <select id="note-cat" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          <option value="Vizit">Vizit / Hekim Planı</option>
          <option value="Hemşirelik">Hemşirelik Gözlemi</option>
          <option value="Acil/Olay">Acil Durum / Kötüleşme</option>
          <option value="Konsültasyon">Konsültasyon Notu</option>
        </select>
      </div>
      <div>
        <label class="text-slate-400 block mb-1">Not İçeriği</label>
        <textarea id="note-content" rows="4" placeholder="Hastanın durumu, hekim direktifleri, planlar..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white placeholder-slate-500"></textarea>
      </div>
      <button onclick="saveNote()" class="w-full py-2.5 bg-cyan-600 active:bg-cyan-700 rounded-lg text-white font-bold">Kaydet</button>
    </div>
  </div>

  <!-- İLAÇ EKLEME MODALI -->
  <div id="modal-med" class="fixed inset-0 bg-black/70 z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div class="bg-slate-800 border-t sm:border border-slate-700 rounded-t-2xl sm:rounded-xl max-w-md w-full p-4 space-y-3 text-xs">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <span class="font-bold text-white text-sm">İlaç / Tedavi Ekle</span>
        <button onclick="closeModal('modal-med')" class="text-slate-400 text-lg">&times;</button>
      </div>
      <div>
        <label class="text-slate-400 block mb-1">İlaç Adı</label>
        <input type="text" id="med-name" placeholder="Örn: Meropenem, Noradrenalin" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-slate-400 block mb-1">Doz & Yol</label>
          <input type="text" id="med-dose" placeholder="3x1 gr IV / 0.1 mcg/kg/dk" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Uygulama Saatleri</label>
          <input type="text" id="med-hours" placeholder="08:00 - 16:00 - 24:00" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
      </div>
      <div>
        <label class="text-slate-400 block mb-1">Açıklama / Protokol</label>
        <input type="text" id="med-notes" placeholder="Santral yoldan, uzatılmış infüzyon vb." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
      </div>
      <button onclick="saveMed()" class="w-full py-2.5 bg-purple-600 active:bg-purple-700 rounded-lg text-white font-bold">Kaydet</button>
    </div>
  </div>

  <!-- TETKİK EKLEME MODALI -->
  <div id="modal-lab" class="fixed inset-0 bg-black/70 z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div class="bg-slate-800 border-t sm:border border-slate-700 rounded-t-2xl sm:rounded-xl max-w-md w-full p-4 space-y-3 text-xs">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <span class="font-bold text-white text-sm">Tetkik / Sonuç Ekle</span>
        <button onclick="closeModal('modal-lab')" class="text-slate-400 text-lg">&times;</button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-slate-400 block mb-1">Tetkik Türü</label>
          <select id="lab-type" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
            <option value="Arteryel Kan Gazı">Kan Gazı (AKG)</option>
            <option value="Biyokimya">Biyokimya / Renal</option>
            <option value="Hemogram">Hemogram / Pıhtılaşma</option>
            <option value="Enfeksiyon/Kültür">Kültür / CRP / Prokalsitonin</option>
            <option value="Görüntüleme">Radyoloji / Eko</option>
          </select>
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Örnek Saati</label>
          <input type="text" id="lab-time" placeholder="06:30" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
      </div>
      <div>
        <label class="text-slate-400 block mb-1">Değerler</label>
        <textarea id="lab-results" rows="3" placeholder="Örn: pH: 7.35, pO2: 84, pCO2: 40, Laktat: 1.6, Kreatinin: 1.4" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white placeholder-slate-500"></textarea>
      </div>
      <button onclick="saveLab()" class="w-full py-2.5 bg-rose-600 active:bg-rose-700 rounded-lg text-white font-bold">Kaydet</button>
    </div>
  </div>

  <!-- VİTAL MODALI -->
  <div id="modal-vital" class="fixed inset-0 bg-black/70 z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div class="bg-slate-800 border-t sm:border border-slate-700 rounded-t-2xl sm:rounded-xl max-w-md w-full p-4 space-y-3 text-xs">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <span class="font-bold text-white text-sm">Vital & Sıvı Kaydı</span>
        <button onclick="closeModal('modal-vital')" class="text-slate-400 text-lg">&times;</button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-slate-400 block mb-1">Tansiyon (Sist/Diyast)</label>
          <input type="text" id="vit-bp" placeholder="120/70" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">KTA / Nabız (/dk)</label>
          <input type="number" id="vit-hr" placeholder="84" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">SpO2 (%)</label>
          <input type="number" id="vit-spo2" placeholder="97" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Ateş (°C)</label>
          <input type="number" step="0.1" id="vit-temp" placeholder="36.8" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Kan Şekeri (mg/dL)</label>
          <input type="number" id="vit-bg" placeholder="130" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Saatlik İdrar (mL)</label>
          <input type="number" id="vit-urine" placeholder="80" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
      </div>
      <button onclick="saveVital()" class="w-full py-2.5 bg-emerald-600 active:bg-emerald-700 rounded-lg text-white font-bold">Kaydet</button>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- JAVASCRIPT ÇOKLU HASTA MOTORU                            -->
  <!-- ======================================================== -->
  <script>
    const STORAGE_KEY = 'icu_multi_patient_db';

    // Başlangıç Mock Veritabanı
    const DEFAULT_PATIENTS = [
      {
        id: "p_1",
        name: "Ahmet Yılmaz",
        bed: "Yatak 04",
        day: "3. Gün",
        proto: "2026-94812",
        age: "64 / E",
        diag: "Septik Şok, ARDS",
        allergy: "Penisilin Alerjisi",
        notes: [
          { id: 101, time: "10:30", cat: "Vizit", content: "Noradrenalin titre edilecek. SBT denenecek." },
          { id: 102, time: "08:15", cat: "Hemşirelik", content: "ETT aspirasyonu yapıldı, sekresyon minimal." }
        ],
        meds: [
          { id: 201, name: "Noradrenalin", dose: "0.08 mcg/kg/dk", hours: "Sürekli", notes: "OAB > 65 hedef", given: true },
          { id: 202, name: "Meropenem", dose: "3 x 1 gr IV", hours: "08:00 - 16:00 - 24:00", notes: "Uzatılmış infüzyon", given: true }
        ],
        labs: [
          { id: 301, time: "07:00", type: "Arteryel Kan Gazı", results: "pH: 7.34, pO2: 82, pCO2: 41, Laktat: 1.8" }
        ],
        vitals: [
          { id: 401, time: "11:00", bp: "115/65", hr: 86, spo2: 96, temp: 37.1, bg: 138, urine: 65 }
        ]
      },
      {
        id: "p_2",
        name: "Fatma Demir",
        bed: "Yatak 02",
        day: "1. Gün",
        proto: "2026-94850",
        age: "52 / K",
        diag: "Post-Op Whipple Operasyonu",
        allergy: "Yok",
        notes: [
          { id: 103, time: "09:00", cat: "Vizit", content: "Hemodinamik stabil, batın drenleri saatlik izlenecek." }
        ],
        meds: [
          { id: 203, name: "Parasetamol", dose: "1 gr IV", hours: "08:00 - 16:00", notes: "Ağrı kontrolü", given: true }
        ],
        labs: [],
        vitals: [
          { id: 402, time: "10:00", bp: "125/75", hr: 78, spo2: 98, temp: 36.6, bg: 120, urine: 90 }
        ]
      }
    ];

    let patients = JSON.parse(localStorage.getItem(STORAGE_KEY)) || DEFAULT_PATIENTS;
    let currentPatientId = null;
    let editingPatientId = null;

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(patients));
    }

    function getCurrentPatient() {
      return patients.find(p => p.id === currentPatientId);
    }

    function getTimeStr() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    // EKRANLAR ARASI GEÇİŞ
    function showPatientList() {
      document.getElementById('view-patient-list').classList.remove('hidden');
      document.getElementById('view-patient-detail').classList.add('hidden');
      currentPatientId = null;
      renderPatientList();
    }

    function backToPatientList() {
      showPatientList();
    }

    function openPatientDetail(patientId) {
      currentPatientId = patientId;
      document.getElementById('view-patient-list').classList.add('hidden');
      document.getElementById('view-patient-detail').classList.remove('hidden');
      switchTab('notes');
      renderPatientDetail();
    }

    // 1. EKRAN RENDER: HASTA LİSTESİ
    function renderPatientList() {
      const container = document.getElementById('patients-cards-container');
      const countLabel = document.getElementById('stat-patient-count');
      countLabel.innerText = `${patients.length} Aktif Hasta`;

      if (patients.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500">
            <i class="fa-solid fa-bed text-4xl mb-3"></i>
            <p class="text-sm">Henüz kayıtlı hasta bulunmuyor.</p>
            <p class="text-xs mt-1 text-slate-600">Yukarıdaki "Yeni Hasta Ekle" butonuna basarak ilk hastayı ekleyebilirsiniz.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      patients.forEach(p => {
        const lastV = (p.vitals && p.vitals.length > 0) ? p.vitals[0] : null;
        
        container.innerHTML += `
          <div onclick="openPatientDetail('${p.id}')" class="bg-slate-800 border border-slate-700 hover:border-cyan-500 rounded-xl p-3.5 shadow-md active:scale-[0.99] transition cursor-pointer">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-xs bg-cyan-950 text-cyan-300 font-mono font-bold px-2 py-0.5 rounded border border-cyan-800">${p.bed}</span>
                <h3 class="font-bold text-white text-sm tracking-wide">${p.name}</h3>
              </div>
              <span class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">${p.day || '1. Gün'}</span>
            </div>

            <p class="text-xs text-slate-400 mt-1.5 line-clamp-1">${p.diag}</p>

            ${lastV ? `
              <div class="grid grid-cols-4 gap-1.5 mt-2.5 pt-2 border-t border-slate-700/60 font-mono text-center text-[10px]">
                <div class="bg-slate-900/60 p-1 rounded"><span class="text-slate-500">TA:</span> <span class="text-cyan-300 font-bold">${lastV.bp || '-'}</span></div>
                <div class="bg-slate-900/60 p-1 rounded"><span class="text-slate-500">KTA:</span> <span class="text-emerald-400 font-bold">${lastV.hr || '-'}</span></div>
                <div class="bg-slate-900/60 p-1 rounded"><span class="text-slate-500">SpO2:</span> <span class="text-sky-400 font-bold">%${lastV.spo2 || '-'}</span></div>
                <div class="bg-slate-900/60 p-1 rounded"><span class="text-slate-500">İdrar:</span> <span class="text-blue-400 font-bold">${lastV.urine || 0}</span></div>
              </div>
            ` : `
              <div class="mt-2 pt-2 border-t border-slate-700/60 text-[10px] text-slate-500 italic">
                Vital ölçümü kaydedilmemiş.
              </div>
            `}
          </div>
        `;
      });
    }

    // 2. EKRAN RENDER: SEÇİLİ HASTA DETAY
    function renderPatientDetail() {
      const p = getCurrentPatient();
      if (!p) return;

      document.getElementById('disp-patient-name').innerText = p.name;
      document.getElementById('disp-patient-bed').innerText = p.bed;
      document.getElementById('disp-patient-diag').innerText = `${p.diag} ${p.allergy ? '• ' + p.allergy : ''}`;
      document.getElementById('disp-patient-day').innerText = p.day || '1. Gün';

      // 1. Notlar
      const nList = document.getElementById('notes-list');
      nList.innerHTML = (!p.notes || p.notes.length === 0) ? '<p class="text-xs text-slate-500 italic">Kayıtlı not yok.</p>' : '';
      (p.notes || []).forEach((n, i) => {
        const catCls = n.cat === 'Acil/Olay' ? 'bg-rose-900/60 text-rose-300 border-rose-700' :
                       n.cat === 'Vizit' ? 'bg-cyan-900/60 text-cyan-300 border-cyan-700' : 'bg-slate-700 text-slate-300 border-slate-600';
        nList.innerHTML += `
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 shadow-sm">
            <div class="flex justify-between items-center mb-1">
              <span class="text-[10px] px-2 py-0.5 rounded border font-semibold ${catCls}">${n.cat}</span>
              <div class="flex items-center gap-2">
                <span class="text-[11px] text-slate-400 font-mono">${n.time}</span>
                <button onclick="deleteNote(${i})" class="text-slate-500 hover:text-rose-400 text-xs"><i class="fa-regular fa-trash-can"></i></button>
              </div>
            </div>
            <p class="text-xs text-slate-200 leading-relaxed">${n.content}</p>
          </div>`;
      });

      // 2. İlaçlar
      const mList = document.getElementById('meds-list');
      mList.innerHTML = (!p.meds || p.meds.length === 0) ? '<p class="text-xs text-slate-500 italic">Kayıtlı ilaç yok.</p>' : '';
      (p.meds || []).forEach((m, i) => {
        mList.innerHTML += `
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex items-center justify-between gap-2">
            <div class="flex-1">
              <div class="flex items-center gap-2">
                <span class="font-bold text-xs ${m.given ? 'line-through text-slate-500' : 'text-white'}">${m.name}</span>
                <span class="text-[10px] text-purple-300 bg-purple-950/60 px-1.5 py-0.2 rounded border border-purple-800">${m.dose}</span>
              </div>
              <div class="text-[11px] text-slate-400 mt-0.5 flex items-center gap-2">
                <span><i class="fa-regular fa-clock text-[10px]"></i> ${m.hours}</span>
                ${m.notes ? `<span class="text-slate-500">• ${m.notes}</span>` : ''}
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="toggleMed(${i})" class="px-2.5 py-1 rounded-lg text-xs font-semibold ${m.given ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-slate-700 text-slate-300 active:bg-slate-600'}">
                ${m.given ? '<i class="fa-solid fa-check"></i> Verildi' : 'Uygula'}
              </button>
              <button onclick="deleteMed(${i})" class="text-slate-500 hover:text-rose-400 p-1"><i class="fa-regular fa-trash-can"></i></button>
            </div>
          </div>`;
      });

      // 3. Tetkikler
      const lList = document.getElementById('labs-list');
      lList.innerHTML = (!p.labs || p.labs.length === 0) ? '<p class="text-xs text-slate-500 italic">Kayıtlı tetkik yok.</p>' : '';
      (p.labs || []).forEach((l, i) => {
        lList.innerHTML += `
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 shadow-sm">
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold text-xs text-rose-300 flex items-center gap-1"><i class="fa-solid fa-flask text-[11px]"></i> ${l.type}</span>
              <div class="flex items-center gap-2">
                <span class="text-[11px] text-slate-400 font-mono">${l.time}</span>
                <button onclick="deleteLab(${i})" class="text-slate-500 hover:text-rose-400 text-xs"><i class="fa-regular fa-trash-can"></i></button>
              </div>
            </div>
            <div class="text-xs text-slate-200 font-mono bg-slate-900/80 p-2 rounded-lg border border-slate-750 mt-1 whitespace-pre-wrap">${l.results}</div>
          </div>`;
      });

      // 4. Vitaller
      const lvCard = document.getElementById('latest-vital-card');
      const vitals = p.vitals || [];
      if (vitals.length > 0) {
        const v = vitals[0];
        lvCard.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-700 pb-1.5">
            <span class="font-semibold text-slate-300">Son Ölçüm (${v.time})</span>
            <span class="text-[10px] text-emerald-400 bg-emerald-950/60 px-1.5 py-0.5 rounded border border-emerald-800">Stabil</span>
          </div>
          <div class="grid grid-cols-3 gap-2 pt-1 font-mono text-center">
            <div class="bg-slate-900/60 p-1.5 rounded"><div class="text-[10px] text-slate-500">TA</div><div class="font-bold text-cyan-400">${v.bp || '-'}</div></div>
            <div class="bg-slate-900/60 p-1.5 rounded"><div class="text-[10px] text-slate-500">Nabız</div><div class="font-bold text-emerald-400">${v.hr || '-'}</div></div>
            <div class="bg-slate-900/60 p-1.5 rounded"><div class="text-[10px] text-slate-500">SpO2</div><div class="font-bold text-sky-400">%${v.spo2 || '-'}</div></div>
            <div class="bg-slate-900/60 p-1.5 rounded"><div class="text-[10px] text-slate-500">Ateş</div><div class="font-bold text-amber-400">${v.temp ? v.temp + '°' : '-'}</div></div>
            <div class="bg-slate-900/60 p-1.5 rounded"><div class="text-[10px] text-slate-500">KŞ</div><div class="font-bold text-purple-400">${v.bg || '-'}</div></div>
            <div class="bg-slate-900/60 p-1.5 rounded"><div class="text-[10px] text-slate-500">İdrar</div><div class="font-bold text-blue-400">${v.urine || '-'} mL</div></div>
          </div>`;
      } else {
        lvCard.innerHTML = '<p class="text-xs text-slate-500 italic">Kayıtlı vital bulunmuyor.</p>';
      }

      const vList = document.getElementById('vitals-list');
      vList.innerHTML = '';
      vitals.slice(1).forEach((v, i) => {
        vList.innerHTML += `
          <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-2 flex justify-between items-center text-slate-300">
            <span class="font-mono text-slate-400">${v.time}</span>
            <span class="font-mono">${v.bp || '-'}</span>
            <span class="font-mono text-emerald-400">${v.hr || '-'} bpm</span>
            <span class="font-mono text-sky-400">%${v.spo2 || '-'}</span>
            <button onclick="deleteVital(${i + 1})" class="text-slate-500 hover:text-rose-400"><i class="fa-regular fa-trash-can text-xs"></i></button>
          </div>`;
      });
    }

    // MODAL YÖNETİMİ
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // HASTA EKLEME / DÜZENLEME MODALI
    function openPatientModal(patientId) {
      editingPatientId = patientId;
      const modalTitle = document.getElementById('modal-patient-title');

      if (patientId) {
        modalTitle.innerText = "Hasta Bilgilerini Düzenle";
        const p = patients.find(item => item.id === patientId);
        if (p) {
          document.getElementById('inp-p-name').value = p.name || '';
          document.getElementById('inp-p-bed').value = p.bed || '';
          document.getElementById('inp-p-day').value = p.day || '';
          document.getElementById('inp-p-proto').value = p.proto || '';
          document.getElementById('inp-p-age').value = p.age || '';
          document.getElementById('inp-p-diag').value = p.diag || '';
          document.getElementById('inp-p-allergy').value = p.allergy || '';
        }
      } else {
        modalTitle.innerText = "Yeni Hasta Kaydı Ekle";
        document.getElementById('inp-p-name').value = '';
        document.getElementById('inp-p-bed').value = '';
        document.getElementById('inp-p-day').value = '1. Gün';
        document.getElementById('inp-p-proto').value = '';
        document.getElementById('inp-p-age').value = '';
        document.getElementById('inp-p-diag').value = '';
        document.getElementById('inp-p-allergy').value = '';
      }

      openModal('modal-patient');
    }

    function savePatient() {
      const name = document.getElementById('inp-p-name').value.trim();
      const bed = document.getElementById('inp-p-bed').value.trim();
      const diag = document.getElementById('inp-p-diag').value.trim();

      if (!name || !bed || !diag) {
        alert('Lütfen Hasta Adı, Yatak No ve Tanı alanlarını doldurun.');
        return;
      }

      if (editingPatientId) {
        // Mevcut Hastayı Güncelle
        const p = patients.find(item => item.id === editingPatientId);
        if (p) {
          p.name = name;
          p.bed = bed;
          p.day = document.getElementById('inp-p-day').value.trim() || '1. Gün';
          p.proto = document.getElementById('inp-p-proto').value.trim();
          p.age = document.getElementById('inp-p-age').value.trim();
          p.diag = diag;
          p.allergy = document.getElementById('inp-p-allergy').value.trim();
        }
      } else {
        // Yeni Hasta Oluştur
        const newPatient = {
          id: 'p_' + Date.now(),
          name: name,
          bed: bed,
          day: document.getElementById('inp-p-day').value.trim() || '1. Gün',
          proto: document.getElementById('inp-p-proto').value.trim(),
          age: document.getElementById('inp-p-age').value.trim(),
          diag: diag,
          allergy: document.getElementById('inp-p-allergy').value.trim(),
          notes: [],
          meds: [],
          labs: [],
          vitals: []
        };
        patients.unshift(newPatient);
      }

      saveToStorage();
      closeModal('modal-patient');

      if (currentPatientId) {
        renderPatientDetail();
      } else {
        renderPatientList();
      }
    }

    function deleteCurrentPatient() {
      const p = getCurrentPatient();
      if (!p) return;
      if (confirm(`"${p.name}" adlı hastayı yoğun bakım listesinden silmek/taburcu etmek istediğinize emin misiniz?`)) {
        patients = patients.filter(item => item.id !== currentPatientId);
        saveToStorage();
        showPatientList();
      }
    }

    // ALT KAYIT İŞLEMLERİ (NOT, İLAÇ, LAB, VİTAL)
    function saveNote() {
      const p = getCurrentPatient();
      const content = document.getElementById('note-content').value.trim();
      if (!content || !p) return;
      if (!p.notes) p.notes = [];
      p.notes.unshift({ id: Date.now(), time: getTimeStr(), cat: document.getElementById('note-cat').value, content: content });
      saveToStorage();
      document.getElementById('note-content').value = '';
      closeModal('modal-note');
      renderPatientDetail();
    }

    function deleteNote(idx) {
      const p = getCurrentPatient();
      if (!p || !confirm('Bu notu silmek istiyor musunuz?')) return;
      p.notes.splice(idx, 1);
      saveToStorage();
      renderPatientDetail();
    }

    function saveMed() {
      const p = getCurrentPatient();
      const name = document.getElementById('med-name').value.trim();
      if (!name || !p) return;
      if (!p.meds) p.meds = [];
      p.meds.push({
        id: Date.now(), name: name,
        dose: document.getElementById('med-dose').value || 'Standart',
        hours: document.getElementById('med-hours').value || 'Günde 1',
        notes: document.getElementById('med-notes').value || '', given: false
      });
      saveToStorage();
      document.getElementById('med-name').value = '';
      closeModal('modal-med');
      renderPatientDetail();
    }

    function toggleMed(idx) {
      const p = getCurrentPatient();
      if (!p || !p.meds) return;
      p.meds[idx].given = !p.meds[idx].given;
      saveToStorage();
      renderPatientDetail();
    }

    function deleteMed(idx) {
      const p = getCurrentPatient();
      if (!p || !confirm('Bu ilacı silmek istiyor musunuz?')) return;
      p.meds.splice(idx, 1);
      saveToStorage();
      renderPatientDetail();
    }

    function saveLab() {
      const p = getCurrentPatient();
      const results = document.getElementById('lab-results').value.trim();
      if (!results || !p) return;
      if (!p.labs) p.labs = [];
      p.labs.unshift({
        id: Date.now(), time: document.getElementById('lab-time').value || getTimeStr(),
        type: document.getElementById('lab-type').value, results: results
      });
      saveToStorage();
      document.getElementById('lab-results').value = '';
      closeModal('modal-lab');
      renderPatientDetail();
    }

    function deleteLab(idx) {
      const p = getCurrentPatient();
      if (!p || !confirm('Bu sonucu silmek istiyor musunuz?')) return;
      p.labs.splice(idx, 1);
      saveToStorage();
      renderPatientDetail();
    }

    function saveVital() {
      const p = getCurrentPatient();
      if (!p) return;
      if (!p.vitals) p.vitals = [];
      p.vitals.unshift({
        id: Date.now(), time: getTimeStr(),
        bp: document.getElementById('vit-bp').value,
        hr: document.getElementById('vit-hr').value,
        spo2: document.getElementById('vit-spo2').value,
        temp: document.getElementById('vit-temp').value,
        bg: document.getElementById('vit-bg').value,
        urine: document.getElementById('vit-urine').value
      });
      saveToStorage();
      closeModal('modal-vital');
      renderPatientDetail();
    }

    function deleteVital(idx) {
      const p = getCurrentPatient();
      if (!p || !confirm('Bu vital kaydını silmek istiyor musunuz?')) return;
      p.vitals.splice(idx, 1);
      saveToStorage();
      renderPatientDetail();
    }

    function switchTab(tab) {
      ['notes', 'meds', 'labs', 'vitals'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`btn-tab-${t}`).classList.remove('text-cyan-400');
        document.getElementById(`btn-tab-${t}`).classList.add('text-slate-400');
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`btn-tab-${tab}`).classList.add('text-cyan-400');
      document.getElementById(`btn-tab-${tab}`).classList.remove('text-slate-400');
    }

    function copyHandoffSummary() {
      const p = getCurrentPatient();
      if (!p) return;
      const lv = (p.vitals && p.vitals[0]) || {};

      let txt = `🏥 *YBÜ HASTA DEVİR BİLGİSİ*\n*Hasta:* ${p.name} (${p.bed})\n*Tanı:* ${p.diag} - ${p.day}\n`;
      if (p.allergy) txt += `*Alerji:* ${p.allergy}\n`;
      txt += `\n📊 *Son Vitaller (${lv.time || '-'}):*\n• TA: ${lv.bp || '-'} | KTA: ${lv.hr || '-'} | SpO2: %${lv.spo2 || '-'}\n• Ateş: ${lv.temp || '-'}°C | KŞ: ${lv.bg || '-'} | İdrar: ${lv.urine || '-'} mL\n\n`;
      txt += `💊 *Tedaviler:*\n` + (p.meds && p.meds.length ? p.meds.map(m => `• ${m.name} (${m.dose}) [${m.hours}] - ${m.given ? '✅ Verildi' : '⏳ Bekliyor'}`).join('\n') : '• Aktif ilaç yok') + `\n\n`;
      txt += `🔬 *Son Tetkikler:*\n` + (p.labs && p.labs.length ? p.labs.slice(0, 2).map(l => `• [${l.time}] ${l.type}: ${l.results}`).join('\n') : '• Tetkik girilmedi') + `\n\n`;
      txt += `📋 *Son Notlar:*\n` + (p.notes && p.notes.length ? p.notes.slice(0, 2).map(n => `• [${n.time} - ${n.cat}]: ${n.content}`).join('\n') : '• Not girilmedi');

      navigator.clipboard.writeText(txt).then(() => {
        alert(`✅ ${p.name} için nöbet özeti panoya kopyalandı!`);
      }).catch(() => alert("Kopyalama izni verilmedi."));
    }

    // Başlangıç: Hasta Listesini Yükle
    showPatientList();
  </script>
</body>
</html>
